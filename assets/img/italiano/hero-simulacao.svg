    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="2400" height="1350">
      <!-- SIMULACAO — nao e foto da casa. Trocar pelo arquivo real. -->
      <defs>
        <filter id="borrar" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="121"/>
        </filter>
        <filter id="grao">
          <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="4" stitchTiles="stitch"/>
          <feColorMatrix type="saturate" values="0"/>
        </filter>
        <radialGradient id="vinheta" cx="50%" cy="46%" r="72%">
          <stop offset="55%" stop-color="#000" stop-opacity="0"/>
          <stop offset="100%" stop-color="#000" stop-opacity=".55"/>
        </radialGradient>
      </defs>
      <rect width="2400" height="1350" fill="#0a1c0f"/>
        <circle cx="62%" cy="54%" r="26%" fill="#ff7a18" opacity="0.62" filter="url(#borrar)"/>
<circle cx="62%" cy="54%" r="13%" fill="#ffd08a" opacity="0.55" filter="url(#borrar)"/>
<circle cx="18%" cy="22%" r="32%" fill="#0e3b1e" opacity="0.7" filter="url(#borrar)"/>
<circle cx="86%" cy="82%" r="26%" fill="#06170c" opacity="0.6" filter="url(#borrar)"/>
      <rect width="2400" height="1350" fill="url(#vinheta)"/>
      <rect width="2400" height="1350" filter="url(#grao)" opacity="0.077"/>
    </svg>
